run_name = "r1_recurrent_gqa"
output_dir = "artifacts/runs"
[model]
d_model = 128
vocab_size = 32000
n_prelude = 1
n_core = 2
n_coda = 1
q_heads = 4
kv_heads = 1
head_dim = 32
ffn_dim = 256
max_seq_len = 256
min_depth = 1
max_depth = 4
mixer = "gqa"
[data]
train_path = "artifacts/data/train.bin"
val_path = "artifacts/data/val.bin"
sequence_length = 256
batch_size = 4
num_workers = 0
pin_memory = true
shuffle_seed = 42
[train]
seed = 42
max_tokens = 1000000
learning_rate = 0.0003
weight_decay = 0.1
warmup_steps = 10
grad_accum_steps = 1
grad_clip_norm = 1.0
[eval]
batch_size = 4
